# Configuration for complete data collection (including failures)
# This config is used with collect_data_complete.py
# Note: save_path will be overridden to /data/RoboCousin/data_include_failure in the script
# if you want to modify the config, please check the following tutorial first:
# https://robotwin-platform.github.io/doc/usage/configurations.html
render_freq: 15
post_success_extra_frames: 5
dual_arm: true
# custom_objects / custom_objects_dir can be commented out to disable them.
episode_num: 5000
use_seed: false
save_freq: 15
# After a successful episode, save this many extra observation frames (hold pose).
post_success_extra_frames: 5
debug_grasp_cp: true
embodiment: [aloha-agilex]
single_embodiment_dual_arm_dis: 0.65
gripper_stiffness: 2000
language_num: 100
domain_randomization:
  random_background: true
  cluttered_table: true
  clean_background_rate: 0.02
  random_head_camera_dis: 0
  random_table_height: 0.03
  random_light: true
  crazy_random_light_rate: 0.02
camera:
  head_camera_type: D435
  wrist_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: true
data_type:
  rgb: true
  third_view: true
  depth: false
  pointcloud: false
  observer: false
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false
pcd_down_sample_num: 1024
pcd_crop: true
use_cousin_coordinate: false
# Optional path generated by the cousin-layout pipeline. Keep empty for
# regular collection; set it only when use_cousin_coordinate is true.
cousin_relative_layout_json: ""
# cousin_target_labels: ["charger"]
# cousin_reference_labels: ["smartphone"]
# Random yaw for clutter / reference objects (B). When true, all table objects
# except the target are also randomly rotated.
cousin_random_yaw: false
# Randomize only the target A (cousin_target_labels). If unset, falls back to
# cousin_random_yaw.
cousin_actor_random_yaw: true
# Fine adjustment: rotate all objects by the same additional angle (degrees).
cousin_global_yaw_offset_deg: 0.0
# Additional in-plane rotation by category (degrees), used to correct the
# long-axis orientation of specific objects.
cousin_label_yaw_offset_deg:
  "computer mouse": 90.0
  "smartphone": 90.0
# Default combination aligned with RoboTwin our_objects; do not change casually.
cousin_snapshot_spin_sign: -1.0
cousin_cam_azimuth_sign: 1.0
cousin_yaw_add_pi: 1.0
# Mirror correction, applied only after spin + camera + pi yaw adjustments:
#   none | negate | pi_minus | add_pi
# For left-right mirroring use pi_minus (yaw -> pi - yaw). If it is still
# incorrect, try add_pi (yaw -> yaw + pi) or negate.
cousin_yaw_mirror_mode: pi_minus
skip_stable_check: true
cousin_instance_score_pool_top_k: 3
cousin_anchor_layout: false
cousin_anchor_clutter:
  - label: "computer mouse"
    offset_xy: [-0.25, 0.3]
  - label: "smartphone"
    offset_xy: [0.2, 0.1]  
cousin_instance_indices:
    # "earbud case": [0,1,2,4]
    "charger": [0,1,2,3]
    "computer mouse": [0,1,2,4]
    "smartphone": [0,1,2,4]
#save_path: ./data  # Will be overridden in collect_data_complete.py (see script/path_config.py)
clear_cache_freq: 5
collect_data: true
eval_video_log: true
use_custom_objects: true
custom_objects_dir: our_assets/actor
# custom_objects: ["computer mouse"]
custom_object_scale: 1
custom_object_fix_root: false
custom_object_upright_only: true
custom_object_spawn_height: 0.0
custom_object_base_qpos: [0.7071, 0.7071, 0.0, 0.0]  # 90-degree X-axis rotation
# pick_up only: spawn the target horizontally and randomize its orientation
# around the table normal (Z axis), for both custom and built-in objects.
pick_up_spawn_horizontal: false
# To suppress rolling while horizontal: higher angular damping reduces rolling
# (shake_bottle defaults to 10); linear damping reduces sliding.
pick_up_spawn_horizontal_angular_damping: 10.0
pick_up_spawn_horizontal_linear_damping: 2.0
# Global object-table friction. The default is 0.5; increase it if objects
# still roll.
#static_friction: 1.0
#dynamic_friction: 1.0
# Override the mixed horizontal grasp-point height for pick_up at runtime
# without modifying model_data.json; 0.5 is the object-height midpoint.
pick_up_horizontal_height_ratio: 0.5
# Evaluation ablation: force pick_up target onto one table side.
# auto = original random placement; left/right force x < 0 or x > 0.
object_spawn_side: auto
object_spawn_side_margin: 0.08
#custom_object_base_qpos: [1, 0, 0.0, 0.0]
grasp_preference_by_object:
  #apple: vertical
  #orange1: vertical
  #jelly: vertical
  #coke: horizontal

place_a2b_offset_m: 0.13   # e.g., 13 cm; larger values place A farther from B



#python script/collect_data_complete.py pick_up demo_complete

