# if you want to modify the config, please check the following tutorial first:
# https://robotwin-platform.github.io/doc/usage/configurations.html
render_freq: 1
dual_arm: false
episode_num: 20
use_seed: false
save_freq: 15
embodiment: [aloha-agilex]
language_num: 100
debug_bread_basket_trace: true
domain_randomization:
  random_background: true
  cluttered_table: false
  clean_background_rate: 0.02
  random_head_camera_dis: 0
  random_table_height: 0.03
  random_light: true
  crazy_random_light_rate: 0.02
camera:
  head_camera_type: D435
  wrist_camera_type: D435
  collect_head_camera: true
  collect_wrist_camera: true
data_type:
  rgb: true
  third_view: false
  depth: false
  pointcloud: false
  observer: false
  endpose: true
  qpos: true
  mesh_segmentation: false
  actor_segmentation: false
pcd_down_sample_num: 1024
pcd_crop: true
save_path: ./data
clear_cache_freq: 5
collect_data: true
eval_video_log: true
use_custom_objects: false
use_custom_env_objects: false
custom_env_objects_dir: our_assets/actor
custom_objects_dir: our_assets/actor
#custom_objects: ["jelly"]   # Pin a specific object first.
custom_object_scale: 0.75
custom_object_fix_root: false
skip_stable_check: false
custom_object_upright_only: true
custom_object_spawn_height: 0.0
custom_object_base_qpos: [0.7071, 0.7071, 0.0, 0.0]  # 90-degree X-axis rotation
debug_grasp_cp: true
grasp_preference_by_object:
  #apple: vertical
  #orange1: vertical
  #jelly: vertical
  coke: horizontal
require_grasp_pose_reachable: true

# -------- Debug / avoidance tuning (basket & bread_basket tasks) --------
debug_held_object_collision: true

# Pre-place and final approach distances along basket functional-point +Z axis
basket_pre_dis: 0.12
basket_place_dis: 0.1

# Rim clearance (ensure held object clears basket top geometry during XY transit)
basket_above_target: 0.10
basket_rim_clearance_factor: 0.8
basket_rim_clearance_margin: 0.06
basket_rim_clearance_max: 0.22
basket_drop_below_rim: 0.0

# -------- Placement tuning (for place_object_stand task) --------
place_clearance: 0.01                      # meters, gap between object bottom and stand surface before releasing
place_bottom_safety_factor: 1.5            # >=1, more conservative bottom estimate (reduce pressing at the cost of higher drop)
place_dis: 0.05                            # meters, final approach distance before opening (bigger -> less pressing, default 0.01)
post_release_lift: 0.08                    # meters, lift gripper up after opening to avoid re-contact/drag
release_settle_steps: 60                   # sim steps to wait after opening before retreat (prevents dragging the object up)